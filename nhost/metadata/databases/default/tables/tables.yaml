- table:
    schema: public
    name: workflow_runs
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          table:
            schema: public
            name: step_runs
          column: workflow_run_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, status, trigger_type, input, started_at, completed_at, error, created_at]
        filter:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        check:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in: [owner, editor]
        columns: [workflow_id, trigger_type, input]

- table:
    schema: public
    name: step_runs
  object_relationships:
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
    - name: workflow_step
      using:
        foreign_key_constraint_on: workflow_step_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_run_id, workflow_step_id, status, input, output, error, attempt_count, approved_by, approved_at, started_at, completed_at, created_at]
        filter:
          workflow_run:
            workflow:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id

- table:
    schema: public
    name: workflow_results
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
  event_triggers:
    - name: send_notification
      definition:
        enable_manual: false
        insert:
          columns: "*"
      retry_conf:
        interval_sec: 10
        num_retries: 0
        timeout_sec: 60
      webhook: "{{NHOST_FUNCTIONS_URL}}/notification"
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, workflow_run_id, result, created_at]
        filter:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id

- table:
    schema: auth
    name: users
  configuration:
    custom_column_names:
      display_name: displayName
      avatar_url: avatarUrl
  select_permissions:
    - role: user
      permission:
        columns: [id, display_name, avatar_url, email]
        filter: {}

- table:
    schema: public
    name: org_invites
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: invited_user
      using:
        manual_configuration:
          remote_table:
            schema: auth
            name: users
          column_mapping:
            invited_user_id: id
    - name: inviter
      using:
        manual_configuration:
          remote_table:
            schema: auth
            name: users
          column_mapping:
            invited_by: id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, invited_user_id, invited_by, role, status, created_at]
        filter:
          _or:
            - invited_user_id:
                _eq: X-Hasura-User-Id
            - organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]
  insert_permissions:
    - role: user
      permission:
        check:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in: [owner, editor]
        columns: [org_id, invited_user_id, role]
        set:
          invited_by: x-hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns: [status]
        filter:
          _and:
            - invited_user_id:
                _eq: X-Hasura-User-Id
            - status:
                _eq: pending
  delete_permissions:
    - role: user
      permission:
        filter:
          _or:
            - invited_user_id:
                _eq: X-Hasura-User-Id
            - organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]


- table:
    schema: public
    name: organizations
  array_relationships:
    - name: members
      using:
        foreign_key_constraint_on:
          table:
            schema: public
            name: org_members
          column: org_id
    - name: workflows
      using:
        foreign_key_constraint_on:
          table:
            schema: public
            name: workflows
          column: org_id
    - name: invites
      using:
        foreign_key_constraint_on:
          table:
            schema: public
            name: org_invites
          column: org_id
  select_permissions:
    - role: user
      permission:
        columns: [id, name, quota_limit, quota_used, quota_period_start, created_at, updated_at]
        filter:
          _or:
            - members:
                user_id:
                  _eq: X-Hasura-User-Id
            - invites:
                invited_user_id:
                  _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        check: {}
        columns: [name]
  update_permissions:
    - role: user
      permission:
        columns: [name]
        filter:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner

- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: user
      using:
        manual_configuration:
          remote_table:
            schema: auth
            name: users
          column_mapping:
            user_id: id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        check:
          _or:
            - organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: owner
            - _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
        columns: [org_id, user_id, role]
  update_permissions:
    - role: user
      permission:
        columns: [role]
        filter:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner

- table:
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: steps
      using:
        foreign_key_constraint_on:
          table:
            schema: public
            name: workflow_steps
          column: workflow_id
    - name: triggers
      using:
        foreign_key_constraint_on:
          table:
            schema: public
            name: workflow_triggers
          column: workflow_id
    - name: runs
      using:
        foreign_key_constraint_on:
          table:
            schema: public
            name: workflow_runs
          column: workflow_id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, name, description, created_by, created_at, updated_at]
        filter:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        check:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in: [owner, editor]
        columns: [org_id, name, description, created_by]
  update_permissions:
    - role: user
      permission:
        columns: [name, description]
        filter:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in: [owner, editor]
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner

- table:
    schema: public
    name: workflow_steps
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          table:
            schema: public
            name: step_runs
          column: workflow_step_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, position, name, type, config, created_at, updated_at]
        filter:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        check:
          _or:
            - _and:
                - workflow:
                    organization:
                      members:
                        _and:
                          - user_id:
                              _eq: X-Hasura-User-Id
                          - role:
                              _eq: owner
            - _and:
                - workflow:
                    organization:
                      members:
                        _and:
                          - user_id:
                              _eq: X-Hasura-User-Id
                          - role:
                              _eq: editor
                - type:
                    _nin: [db_write, notify]
        columns: [workflow_id, position, name, type, config]
  update_permissions:
    - role: user
      permission:
        columns: [position, name, type, config]
        filter:
          _or:
            - _and:
                - workflow:
                    organization:
                      members:
                        _and:
                          - user_id:
                              _eq: X-Hasura-User-Id
                          - role:
                              _eq: owner
            - _and:
                - workflow:
                    organization:
                      members:
                        _and:
                          - user_id:
                              _eq: X-Hasura-User-Id
                          - role:
                              _eq: editor
                - type:
                    _nin: [db_write, notify]
  delete_permissions:
    - role: user
      permission:
        filter:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in: [owner, editor]

